<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/www/html/data>
        Require all denied
    </Directory>
    <Directory /var/www/html/admin/includes>
        Require all denied
    </Directory>
    <Directory /var/www/html/uploads>
        php_admin_flag engine off
        <FilesMatch "\.(php|phtml|phar|cgi|pl|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <DirectoryMatch "^/var/www/html/\.">
        Require all denied
    </DirectoryMatch>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
